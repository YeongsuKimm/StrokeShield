<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | StrokeShield</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { --paper: #fbfbf9; --ink: #12161b; --ink-2: #4a5561; --accent: #0b5cab; --danger: #b3261e; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: var(--paper); color: var(--ink); font: 1.0625rem/1.55 "Avenir Next", Avenir, "Nunito Sans", system-ui, sans-serif; }
      main { max-width: 34rem; }
      h1 { margin: 0 0 1rem; font: 500 2.5rem/1.1 "Tiempos Headline", "Newsreader", "Iowan Old Style", Georgia, serif; letter-spacing: -0.012em; text-wrap: balance; }
      p { margin: 0 0 1.5rem; color: var(--ink-2); text-wrap: pretty; }
      nav { display: flex; flex-wrap: wrap; gap: 0.75rem; }
      a { display: inline-block; padding: 0.75rem 1.25rem; border-radius: 0.625rem; font-weight: 600; text-decoration: none; }
      a.go { background: var(--accent); color: #fff; }
      a.call { background: var(--danger); color: #fff; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>That page is not here.</h1>
      <p>The check lives on the home page. If you think someone may be having a stroke, do not spend time looking for it: call 911.</p>
      <nav>
        <a class="go" href="/">Go to the check</a>
        <a class="call" href="tel:911">Call 911</a>
      </nav>
    </main>
  </body>
</html>
